spring.application.name=barbershop-backend-test

# Test Database (H2)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT for tests
app.jwt.secret=testSecretKeyForBarberShopThatIsAtLeast256BitsLongForHS256AlgorithmTest
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Business config
app.business.opening-hour=9
app.business.closing-hour=21
app.business.slot-interval-minutes=30
app.booking.token-expiration-hours=24
app.booking.max-advance-days=60

# CORS for tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.barbershop.backend=WARN
logging.level.org.springframework.security=WARN