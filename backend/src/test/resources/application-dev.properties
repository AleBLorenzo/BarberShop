# Perfil dev PARA TESTS: sombrea application-dev.properties de src/main
# (que apunta a PostgreSQL local). Los tests siempre corren contra H2 en
# memoria determinista, igual que la configuración base de test.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Logging silencioso en test (el dev real es DEBUG)
logging.level.com.barbershop.backend=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
