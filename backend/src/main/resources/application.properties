spring.application.name=barbershop-backend


# ===========================================
# Common JPA/Hibernate Settings
# ===========================================
spring.jpa.hibernate.ddl-auto=update
# false por defecto (auditoría B-MED-9): los valores de los parámetros SQL
# (password_hash, tokens, PII) no deben llegar a los logs de producción.
# El perfil dev puede activarlo con SHOW_SQL=true en backend/.env.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# El dialecto NO se fija: Hibernate 6 lo auto-detecta desde el driver de
# PostgreSQL (migración migrate-h2-to-postgresql: el runtime es 100 % PostgreSQL).
spring.jpa.open-in-view=false

# ===========================================
# Default Profile (Development — PostgreSQL local)
# ===========================================
spring.profiles.active=dev

# ===========================================
# Security / JWT
# ===========================================
# Fail-fast: sin JWT_SECRET la app no arranca. El antiguo valor por defecto
# hardcodeado en el repo permitía forjar tokens HS256 (auditoría B-ALTO-1).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===========================================
# Rate limiting (hand-rolled en memoria, sin dependencias — cambio
# harden-open-security-findings, D1). Todos los umbrales son configurables
# por properties o variable de entorno (APP_SECURITY_*).
# ===========================================
# Login: fallos por combinación email+IP y fallos por IP en la ventana
app.security.login.max-attempts-per-account=5
app.security.login.max-attempts-per-ip=20
app.security.login.window-seconds=900
# Reserva pública: peticiones por IP en la ventana + techo diario global
app.security.booking.max-per-ip=10
app.security.booking.window-seconds=3600
app.security.booking.max-per-day=100
# Confianza en X-Real-IP/X-Forwarded-For (activa en prod tras nginx; pon en
# false si el backend se expone sin proxy delante)
app.security.trust-proxy-headers=true

# ===========================================
# Business Configuration
# ===========================================
# Swagger/OpenAPI: activo por defecto (dev). El perfil prod lo apaga
# (application-prod.properties → 404 en /v3/api-docs y /swagger-ui);
# API_DOCS_ENABLED solo tiene sentido si quisieras apagarlo en otro perfil.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
app.business.opening-hour=9
app.business.closing-hour=20
# Días cerrados (lista de DayOfWeek, coma separada)
app.business.closed-days=SUNDAY
app.business.slot-interval-minutes=30
# Marca visible (títulos, correos, .ics) y enlace a Google Maps
app.business.name=TheTankBarber
app.business.maps-url=https://maps.app.goo.gl/12BLsdYKtLRCxFRe8
app.booking.token-expiration-hours=24
app.booking.max-advance-days=60

# ===========================================
# Media (fotos locales: trabajadores, servicios, resultados)
# ===========================================
# Directorio raíz de las imágenes subidas; se sirve públicamente en /uploads/**
app.uploads.dir=uploads
# Límite de subida real (por defecto Spring solo admite 1 MB)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ===========================================
# CORS
# ===========================================
# Allowlist por variable de entorno (auditoría B-BAJO-6): los defaults son SOLO
# orígenes locales de desarrollo. En prod la SPA es same-origin vía nginx (no
# hace falta CORS); para una demo con túnel define CORS_ALLOWED_ORIGINS de forma
# explícita. Nunca comodines: CorsConfig falla al arrancar con vacío o "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4173,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# ===========================================
# Demo seeder (solo perfil dev)
# ===========================================
# Credenciales y token demo solo se imprimen en consola con opt-in explícito
# (auditoría B-BAJO-4). Flujo cómodo local: DEMO_PRINT_CREDENTIALS=true.
app.demo.print-credentials=${DEMO_PRINT_CREDENTIALS:false}

# ===========================================
# Mail (correos de confirmación de cita)
# ===========================================
# Sin MAIL_HOST (o con app.mail.enabled=false) el sistema queda en modo log:
# la reserva se crea igual y el envío se omite con un aviso.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:notificaciones@barbershop.local}

# ===========================================
# Logging (verbose SOLO en el perfil dev → ver application-dev.properties;
# en prod predomina INFO sin SQL ni parámetros — auditoría B-MED-9)
# ===========================================
