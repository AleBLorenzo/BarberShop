spring.application.name=backend
# Set CORS_ALLOWED_ORIGINS to the deployed frontend origin(s), comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Server
server.port=${SERVER_PORT:8081}
spring.docker.compose.enabled=false
# Database
spring.datasource.url=${DB_URL:jdbc:h2:file:./barbershop;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
