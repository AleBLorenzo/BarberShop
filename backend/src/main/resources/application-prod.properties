# ===========================================
# Production Profile — PostgreSQL (Oracle Cloud Always Free)
# ===========================================
# Migración migrate-h2-to-postgresql: el runtime es 100 % PostgreSQL; ya no
# existe BD en fichero H2. El esquema lo crea/actualiza ddl-auto=update global
# SIN destruir datos y los datos viven en la base PostgreSQL de la VM, que
# sobrevive a los reinicios. Backup = pg_dump (ver deploy/README.md §12).
#
# Variables de entorno (systemd EnvironmentFile o nativas del SO):
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# Valores por defecto solo para arranque local de prueba; en la VM define SIEMPRE
# las credenciales reales en /etc/barbershop/barbershop.env (ver .env.example).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barbershop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:barbershop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:barbershop}
# driver y dialecto: auto-detección desde el driver PostgreSQL (sin H2Dialect).

# ===========================================
# API docs deshabilitadas (B-INFO-1)
# ===========================================
# En prod no hay documentación pública: /v3/api-docs/**, /swagger-ui.html y
# /swagger-ui/** responden 404 (además nginx ya no publica esas rutas).
springdoc.api-docs.enabled=false
