# ===========================================
# Development Profile — PostgreSQL local
# ===========================================
# Base de datos de desarrollo: PostgreSQL local en el puerto 5432.
# Levántala con `docker compose up -d` en backend/ o instálala nativamente
# (ver backend/README-dev-db.md). Credenciales por defecto = las del compose.
# Sobreescribibles con SPRING_DATASOURCE_URL/USERNAME/PASSWORD (p. ej. en
# backend/.env local, que nunca se commitea).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barbershop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:barbershop}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:barbershop}
# driver y dialecto: auto-detección desde el driver PostgreSQL.

# Logging verboso de desarrollo (auditoría B-MED-9: NO propagar a prod)
logging.level.com.barbershop.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
