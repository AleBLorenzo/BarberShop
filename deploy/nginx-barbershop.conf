# BarberShop — configuración de nginx
# Backend en 127.0.0.1:8080 (NUNCA se abre al exterior), frontend estático
# servido por nginx y proxy same-origin de /api y /uploads ⇒ cero CORS.
#
# Instalación:
#   sudo cp deploy/nginx-barbershop.conf /etc/nginx/sites-available/barbershop
#   sudo ln -s /etc/nginx/sites-available/barbershop /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # Build del frontend (npm run build con VITE_API_BASE_URL=/api)
    root /var/www/barbershop;
    index index.html;

    # El backend admite subidas de hasta 6 MB (spring.servlet.multipart);
    # nginx por defecto solo deja 1 MB.
    client_max_body_size 8m;

    # ---------------------------------------------------------------
    # Compresión (clave en 3G: el bundle JS pasa de ~390 kB a ~126 kB
    # en gzip). `gzip_types` NO incluye text/html (va comprimido por
    # defecto). No se usa gzip_static/brotli: requieren ficheros
    # .gz/.br precomprimidos o módulos externos no garantizados.
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;                # Vary: Accept-Encoding para proxies/cache
    gzip_proxied any;            # comprime también respuestas del proxy /api
    gzip_comp_level 5;           # buen ratio sin CPU excesiva
    gzip_min_length 1024;        # respuestas mínimas no compensan
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------
    # Cabeceras de seguridad del HTML de la SPA (B-BAJO-7, D3)
    # `always` = también en respuestas de error. Definidas como VARIABLES
    # porque una location con su propio add_header NO hereda las del bloque
    # server (gotcha de nginx): las locations con Cache-Control propio
    # (/assets/, ver abajo) repiten los add_header usando estas MISMAS
    # variables ⇒ una única fuente de verdad al editarlas.
    # ---------------------------------------------------------------
    # CSP compatible con el bundle Vite (script-src 'self' sin unsafe-inline:
    # el build no inyecta scripts inline). Google Fonts permitidos en
    # style-src/font-src; imgs 'self' + data: + https: (picsum en dev).
    set $hdr_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'";
    set $hdr_xfo "DENY";
    set $hdr_rp "no-referrer";
    set $hdr_pp "camera=(), microphone=(), geolocation=(), payment=(), usb=()";

    add_header Content-Security-Policy $hdr_csp always;
    add_header X-Frame-Options $hdr_xfo always;
    add_header Referrer-Policy $hdr_rp always;
    add_header Permissions-Policy $hdr_pp always;
    # HSTS: activar SOLO cuando exista TLS (certbot) — sobre HTTP puro los
    # navegadores lo ignoran, pero con doble stack (80 + 443) una petición
    # http no segura sí podría quedar fijada. Descomentar tras certbot (y
    # replicarla con add_header en las locations que tengan add_header propio):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # SPA: cualquier ruta que no sea un fichero real → index.html
    # (react-router BrowserRouter necesita este fallback al recargar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html SIN cachear: es el manifiesto de la SPA (referencia los
    # nombres con hash de los assets). Si se cachea, un deploy nuevo queda
    # inaccesible hasta caducar la caché. `expires -1` ⇒ Cache-Control:
    # no-cache; al no usar add_header aquí se heredan las de seguridad.
    location = /index.html {
        expires -1;
    }

    # Assets con hash (Vite los renombra por content-hash → siempre distintos
    # tras cada build): caché a un año + immutable (ni revalida en reload).
    # OJO: este location define add_header (Cache-Control) y por eso DEBE
    # repetir las de seguridad usando las MISMAS variables del bloque server.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $hdr_csp always;
        add_header X-Frame-Options $hdr_xfo always;
        add_header Referrer-Policy $hdr_rp always;
        add_header Permissions-Policy $hdr_pp always;
        try_files $uri =404;
    }

    # API — proxy inverso al backend (misma origen => sin peticiones CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos subidas (trabajadores, servicios, resultados) — /uploads/** es
    # permitAll en Spring Security y el frontend las pide con rutas relativas
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / OpenAPI: NO se publica en nginx (B-INFO-1). En el perfil
    # prod springdoc está deshabilitado (application-prod.properties → 404),
    # así que tampoco hace falta proxy: cero superficie pública hacia /v3/api-docs.

    # Ficheros estáticos: sin cachear demasiado (el deploy reemplaza el dist).
    # SIN add_header aquí: `expires` ya genera Cache-Control y, al no haber
    # add_header en esta location, se heredan las cabeceras de seguridad del
    # bloque server (un add_header en location anularía las heredadas).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
}
